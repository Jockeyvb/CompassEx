  summary: 後天八卦九星（北斗九星）的完整中文名稱。
  remarks: <p>本數組用於需要完整顯示星曜名稱的場景（如風水報告、羅盤盤面顯示）。</p>
  example: []
  syntax:
    content: public readonly string[] NineStarFullNames
    return:
      type: System.String[]
      description: 包含 9 個元素的字符串數組，順序嚴格對應北斗九星：貪狼、巨門、祿存、文曲、廉貞、武曲、破軍、左輔、右弼。
    content.vb: Public ReadOnly NineStarFullNames As String()
