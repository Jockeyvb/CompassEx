  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 核心数理逻辑判定：基于传统的“四吉四凶”原则，快速验证当前星曜是否属于“四吉星”（辅、贪、巨、武）。
  remarks: 本属性采用高效的字串包含式（<code>IndexOf</code>）底层无感算法，规避了繁琐的逻辑分支判定，专门为高并发排盘渲染和外部 JavaScript 沙箱过滤提供纯净、无偏见的布尔开关（IsGood）。
  example: []
  syntax:
    content: public bool IsGood { get; }
    parameters: []
    return:
      type: System.Boolean
      description: 若属于伏位、生气、天医、延年对应的星曜则返回 <code>true</code>；若属于祸害、六煞、五鬼、绝命对应的星曜则返回 <code>false</code>。
    content.vb: Public ReadOnly Property IsGood As Boolean
  overload: CompassEx.Gua.NineStar.IsGood*
