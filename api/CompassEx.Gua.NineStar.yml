  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 周易数理与风水理气核心：九星（游年八星/紫白九星）的数据抽象模型与静态工厂类。
  remarks: >-
    本类作為平台级别的「材料供应商」，保持极致的架构克制。内部仅提供绝对客观的星曜名称、类型、吉凶逻辑判定以及

    游年映射，<b>不包含任何带有主观色彩的文字评语或顏色渲染样式控制</b>，完美支援外部 C# 主程序调度与第三方动态 JavaScript 插件扩充。
  example: []
