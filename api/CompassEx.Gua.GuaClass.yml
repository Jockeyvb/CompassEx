  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 计算并返回当前复卦的后天五行九宫数。
  remarks: >-
    <b>运算核心门道：</b><br />

    该算法遵循三元地理/玄空大卦之准则，<b>纯粹依据“上卦（外卦）”所在物理方位的后天八卦卦数</b>来裁定整枚复卦的五行总属性。

    属于大卦风水理气（如翻卦水法、龙门八局）判别旺衰的骨干底座。
