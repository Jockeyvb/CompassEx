  summary: 推演当前本卦所对应的“通卦”（又称互通卦）。
  remarks: >-
    <b>通卦数理法则：</b><br />

    在特定大卦法门中，规定一三、二四、六八、七九运数彼此相通。<br />

    该方法在内部动态克隆一个相同的复卦，并强制将<b>第 3 爻（索引 2）与第 4 爻（索引 3）</b>设定为动爻（<code>YaoDoing</code>），

    随后通过调用 <xref href="CompassEx.Gua.GuaClass.GetChangeGua" data-throw-if-not-resolved="false"></xref> 产生错卦变动，从而精准荡出互通的通卦。
