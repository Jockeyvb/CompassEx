    静爻位则保持原卦纳支阴阳。最终通过变动后的爻象序列重组新卦，并将动爻位记录至变卦的 <xref href="CompassEx.Gua.GuaClass.ChangedYao" data-throw-if-not-resolved="false"></xref> 属性中。
