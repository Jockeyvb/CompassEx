  summary: 获得枚举的说明，可分权重（Level）进行排序或过滤显示。
  example: []
  syntax:
    content: public static string GetEnumDescription(this Enum enumConstant, string splitChar = ",", bool isReturnMaxLevelOnly = false, bool includeZero = false, bool hasValue = false, bool opEQ = false, bool orderbyLevelDesc = false)
    parameters:
    - id: enumConstant
      type: System.Enum
      description: 枚举实例常量。
    - id: splitChar
      type: System.String
      description: 分隔符，默认项为逗号。
    - id: isReturnMaxLevelOnly
      type: System.Boolean
      description: 是否仅返回最大权重值。可在枚举项上使用 <code>[Category("{'level':2}")]</code> 确定权重。若为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a> 则返回全部有效说明。
    - id: includeZero
      type: System.Boolean
      description: 是否附加包含零（0）的说明。若为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>，则只有在枚举值本身为 0 时才显示默认说明。
    - id: hasValue
      type: System.Boolean
      description: 显示内容是否包含数据值前缀（例如：1.说明）。
    - id: opEQ
      type: System.Boolean
      description: 是否使用相等操作符判定。若为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a> 则使用等于判定，默认为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>（即使用位运算）。
    - id: orderbyLevelDesc
      type: System.Boolean
      description: 是否按照 JSON 配置中的 LEVEL 属性进行降序排序。
    return:
      type: System.String
      description: 返回组合后的枚举描述字符串。
