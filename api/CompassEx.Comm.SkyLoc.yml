    id: Get60SkyLoc
    path: CompassEx/Comm/SkyLoc.cs
    startLine: 131
  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 获取包含完整天干地支对象绑定的六十甲子实体单元序列（只读原生数组）。
  remarks: <b>性能优化说明：</b>本方法通过单层取模算法动态实例化 60 个干支单元。由于六十甲子属于体系内的核心只读静态元数据，重构后直接返回原生数组，避免了动态列表（<code>List</code>）扩容带来的二次内存拷贝与垃圾回收（GC）开销。
  example: []
  syntax:
    content: public static SkyLoc[] Get60SkyLoc()
    return:
      type: CompassEx.Comm.SkyLoc[]
      description: 返回一个包含 60 个 <xref href="CompassEx.Comm.SkyLoc" data-throw-if-not-resolved="false"></xref> 复合实体的原生数组，按历法顺序排列。
    content.vb: Public Shared Function Get60SkyLoc() As SkyLoc()
  overload: CompassEx.Comm.SkyLoc.Get60SkyLoc*
