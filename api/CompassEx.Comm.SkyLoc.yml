    id: Get60SkyLocNames
    path: CompassEx/Comm/SkyLoc.cs
    startLine: 109
  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 获取经典正统六十甲子干支组合的字符串序列（只读原生数组）。
  remarks: >-
    <p><b>历法推演原理与算法重构：</b></p>

    <p>本方法已重构为现代高精度的<b>单层模运算算法</b>。消除了历史版本中双重嵌套循环（<code>int j = i</code>）导致的干支横向错配与漏项缺陷。</p>

    <p>由于十天干与十二地支的最小公倍数为 60，本算法通过单层 <code>0 ~ 59</code> 闭环流转，对天干基数 10 和地支基数 12 进行动态取模（<code>%</code>），确保干支双轨道同步顺时针推进，完美符合《黄帝内经》及传统干支历法规范。</p>
  example: []
  syntax:
    content: public static string[] Get60SkyLocNames()
    return:
      type: System.String[]
      description: 返回一个长度为 60 的 <xref href="System.String" data-throw-if-not-resolved="false"></xref> 原生数组，按历法流转顺序包含“甲子”到“癸亥”。
    content.vb: Public Shared Function Get60SkyLocNames() As String()
  overload: CompassEx.Comm.SkyLoc.Get60SkyLocNames*
