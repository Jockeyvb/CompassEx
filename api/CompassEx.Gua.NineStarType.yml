  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 勘测系统中的九星模型分类（定义类别实例化时采用的星曜数理体系）。
  remarks: >-
    <p>本枚举用于区分基础易学方位星曜与进阶翻卦理气星曜的数理边界：</p>

    <ul><li>
          <strong><xref href="CompassEx.Gua.NineStarType.AfterGuaNineStar" data-throw-if-not-resolved="false"></xref> (后天八卦九星)：</strong> 严格对应后天八卦八方宫位以及中央五黄廉贞星（共九星）。其星曜名称与峦头山星一致，但底层五行生克属性存在本质差异。
        </li><li>
          <strong><xref href="CompassEx.Gua.NineStarType.GuaFlipNineStar" data-throw-if-not-resolved="false"></xref> (翻卦九星)：</strong> 依据黄石公翻卦掌或辅星水法变爻推导而出的理气星曜。在底层运算中，将左辅星与右弼星合并为“辅星”进行归化，本质上为八星序列。
        </li></ul>
  example: []
  syntax:
    content: public enum NineStarType
    content.vb: Public Enum NineStarType
