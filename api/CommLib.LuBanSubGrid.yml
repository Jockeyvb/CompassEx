  namespace: CommLib
  summary: 鲁班尺小格（分格）类。
  remarks: >-
    该类用于计算和表达传统堪舆学中“鲁班尺”的 32 个小格（如财德、宝库等）。

    每 4 个小格组合为一个大格（由 <xref href="CommLib.LuBanGrid" data-throw-if-not-resolved="false"></xref> 表达）。

    鲁班尺每小格的物理固定尺寸约为 13.40625 毫米。
