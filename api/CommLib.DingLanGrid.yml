  namespace: CommLib
  summary: 丁兰尺大格（分格）类。
  remarks: >-
    该类用于计算和表达传统堪舆学中“丁兰尺”的 10 个大格（如丁、害、旺、苦等）。

    丁兰尺主要用于阴宅、祖先神位等尺寸的吉凶量度。

    每个大格内部包含 4 个小格，大格的物理固定循环尺寸常数定义为 38.78 毫米。
