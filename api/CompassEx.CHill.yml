  summary: 动态获取当前二十四山在罗盘上对应的绝对度数范围。
  remarks: >-
    <p><b>计算依据：</b></p>

    <p>该属性为只读属性，其内部会直接通过调用 <xref href="CompassEx.CompassEx.Get24HillDegree(System.String)" data-throw-if-not-resolved="false"></xref> 方法，传入当前实例的 <xref href="CompassEx.CHill.Name" data-throw-if-not-resolved="false"></xref> 实时计算得出。</p>

    <p>例如：当 <xref href="CompassEx.CHill.Name" data-throw-if-not-resolved="false"></xref> 为“壬”时，返回的度数区间范围即为 <code>337.5 ~ 352.5</code> 度。</p>
  example: []
  syntax:
    content: public CompassRangEX CRangeDegree { get; }
    parameters: []
    return:
      type: CompassEx.Comm.CompassRangEX
      description: 返回一个封装了起始和结束角度的 <xref href="CompassEx.Comm.CompassRangEX" data-throw-if-not-resolved="false"></xref> 对象。
