  summary: 三元罗盘专用六爻卦实体类，继承基础卦类 <xref href="CompassEx.Gua.GuaClass" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    扩展基础卦结构，增加「卦所临爻位」数据存储，用于三元玄空罗盘纳甲、断卦时标记该卦对应的1～2个爻位；

    约束规则：单个卦最多只能关联2个爻位，超出则抛出参数越界异常。
