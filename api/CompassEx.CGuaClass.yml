    id: .ctor
    path: CompassEx/C3Y/CGuaClass.cs
    startLine: 78
  assemblies:
  - CompassEx
  namespace: CompassEx
  summary: 初始化三元罗盘六爻卦实例，并绑定该卦对应的临爻位。
  remarks: >-
    <p><b>⚠️ 业务建模约束：</b></p>

    <p>在三元罗盘的六爻卦逻辑中，单卦所临的爻位存在严格的空间/数理限制：</p>

    <ol><li><b>数量上限：</b>单个卦最多只能同时关联 2 个爻位。</li><li><b>位置关联：</b>当同时存在 2 个临爻时，它们在空间上必须连续（例如：初爻与二爻、三爻与四爻），不可跨爻绑定。</li></ol>
  example: []
  syntax:
    content: public CGuaClass(string GuaNameOrAttrName, params int[]? PlaceYaos)
    parameters:
    - id: GuaNameOrAttrName
      type: System.String
      description: >-
        卦的唯一标识。支持以下两种格式之一：


        <table><thead><tr><th class="term">格式类型</th><th class="description">传入示例与说明</th></tr></thead><tbody><tr><td class="term">标准卦名</td><td class="description">如 <code>"乾"</code>、<code>"坤"</code>、<code>"震"</code>、<code>"巽"</code> 等标准六十四卦汉字名称。</td></tr><tr><td class="term">属性字段名</td><td class="description">底层数据模型映射的属性名称，内部将通过反射机制自动匹配卦体信息。</td></tr></tbody></table>
    - id: PlaceYaos
      type: System.Int32[]
      description: >-
        一个可变长度的整数数组（<code>params</code>），代表当前卦所临的爻位序号。


        <p>该参数使用极其灵活，支持以下传参方式：</p>

        <ul><li>不传任何参数、传入 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> 或空数组：表示当前卦无临爻。</li><li>传入 1 个整数：绑定单个临爻。</li><li>传入 2 个整数：绑定双临爻。<b>注意：这两个爻位必须是连续相邻的。</b></li></ul>
    content.vb: Public Sub New(GuaNameOrAttrName As String, ParamArray PlaceYaos As Integer())
  overload: CompassEx.CGuaClass.#ctor*
  exceptions:
  - type: System.ArgumentOutOfRangeException
    commentId: T:System.ArgumentOutOfRangeException
    description: 当传入的 <code class="paramref">PlaceYaos</code> 数组长度大于 <code>2</code> 时抛出。提示单个卦最多仅能关联 2 个爻位。
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: 当传入的 <code class="paramref">PlaceYaos</code> 数组长度等于 <code>2</code>，但两个爻位序号不连续（不相邻）时抛出。
  nameWithType.vb: CGuaClass.New(String, ParamArray Integer())
  fullName.vb: CompassEx.CGuaClass.New(String, ParamArray Integer())
  name.vb: New(String, ParamArray Integer())
