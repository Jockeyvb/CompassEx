    path: CompassEx/Comm/SkyClass.cs
    startLine: 104
  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 基于十天干序列中的整型索引初始化 <xref href="CompassEx.Comm.SkyClass" data-throw-if-not-resolved="false"></xref> 类的新实例，并自动动态装配其五行属性。
  remarks: >-
    <p><b>五行流转分配矩阵：</b></p>

    <p>本构造函数内部实现了经典正统的天干五行映射机制：</p>

    <ul><li>索引 <code>0, 1</code>（甲、乙） <code> ==&gt; </code> 自动实例化为 <b>木</b> 属性</li><li>索引 <code>2, 3</code>（丙、丁） <code> ==&gt; </code> 自动实例化为 <b>火</b> 属性</li><li>索引 <code>4, 5</code>（戊、己） <code> ==&gt; </code> 自动实例化为 <b>土</b> 属性</li><li>索引 <code>6, 7</code>（庚、辛） <code> ==&gt; </code> 自动实例化为 <b>金</b> 属性</li><li>索引 <code>8, 9</code>（壬、癸） <code> ==&gt; </code> 自动实例化为 <b>水</b> 属性（★已修复历史版本误指为土的隐患）</li></ul>
  example: []
  syntax:
    content: public SkyClass(int iSkyIndex)
    parameters:
    - id: iSkyIndex
      type: System.Int32
      description: 天干在序列中的绝对索引位置，有效取值范围为 <code>0 ~ 9</code>。可参考全局静态字段：<xref href="CompassEx.Comm.SkyClass.SkyNames" data-throw-if-not-resolved="false"></xref>。
    content.vb: Public Sub New(iSkyIndex As Integer)
  overload: CompassEx.Comm.SkyClass.#ctor*
  exceptions:
  - type: System.IndexOutOfRangeException
    commentId: T:System.IndexOutOfRangeException
    description: 当传入的索引小于 0 或大于等于 10 时抛出此异常。
  nameWithType.vb: SkyClass.New(Integer)
  fullName.vb: CompassEx.Comm.SkyClass.New(Integer)
  name.vb: New(Integer)
