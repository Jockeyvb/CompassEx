  summary: 获取一个布尔值，指示当前三爻经卦在后天八卦体系中是否属于“阳卦”。
  remarks: >-
    <b>四阳卦判定法则：</b><br />

    根据后天八卦阴阳划分规范，属于“乾（父）、坎（中男）、艮（少男）、震（长男）”四纯单卦之一的判定为阳卦。<br />

    该属性通过在字符串 <code>"乾坎艮震"</code> 中高速检索当前卦名（<xref href="CompassEx.Gua.GuaSubClass.Name" data-throw-if-not-resolved="false"></xref>）的索引来完成原子级断立。
  example: []
  syntax:
    content: public bool IsSun { get; }
    parameters: []
    return:
      type: System.Boolean
      description: <code>true</code> 代表当前单卦属于阳卦；<code>false</code> 则属于阴卦。
    content.vb: Public ReadOnly Property IsSun As Boolean
  overload: CompassEx.Gua.GuaSubClass.IsSun*
