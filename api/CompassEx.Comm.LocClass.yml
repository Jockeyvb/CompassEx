    startLine: 173
  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 判定指定的小时数（24小时制字符串）是否落入当前地支所代表的时辰范围内。
  remarks: >-
    <p><b>时辰边界算法解析：</b></p>

    <p>由于<b>子时（Index = 0）</b>具有跨天交界的特殊性（即深夜 23:00 至次日凌晨 01:00），无法通过简单的单一区间闭合匹配。因此，当当前地支为子时时，系统会优先触发特殊防御逻辑：只要小时数大于等于 <code>23</code> 或等于 <code>0</code>，即直接判定命中并返回 <code>true</code>。</p>

    <p>对于其它普通时辰，方法会动态解构 <xref href="CompassEx.Comm.LocClass.LocTimeValue" data-throw-if-not-resolved="false"></xref> 的起止字符串，并将其转化为整型进行绝对闭区间匹配。</p>
  example: []
  syntax:
    content: public bool TimeValueInRangIndex(string HH)
    parameters:
    - id: HH
      type: System.String
      description: 24 小时制的小时字符串（如 "08"、"23" 等）。
    return:
      type: System.Boolean
      description: 若该小时数属于当前地支的时辰区间则返回 <code>true</code>；否则返回 <code>false</code>。
    content.vb: Public Function TimeValueInRangIndex(HH As String) As Boolean
  overload: CompassEx.Comm.LocClass.TimeValueInRangIndex*
  nameWithType.vb: LocClass.TimeValueInRangIndex(String)
  fullName.vb: CompassEx.Comm.LocClass.TimeValueInRangIndex(String)
  name.vb: TimeValueInRangIndex(String)
