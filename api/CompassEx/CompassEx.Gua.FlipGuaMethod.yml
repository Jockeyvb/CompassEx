  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 翻卦九星法：风水三大核心勘测对象（龙、山、水）的方法分类。
  remarks: >-
    <p><b>方法论说明 (Methodology Note)：</b></p>

    <p>在风水理论中，<xref href="CompassEx.Gua.FlipGuaMethod.Dragon" data-throw-if-not-resolved="false"></xref>（龙法）与 <xref href="CompassEx.Gua.FlipGuaMethod.Hill" data-throw-if-not-resolved="false"></xref>（山法）的公式推导与应用方法论本质上是一致的，均采用黄石公翻卦掌之「边起边落、中起中落」变爻轨迹；而 <xref href="CompassEx.Gua.FlipGuaMethod.Water" data-throw-if-not-resolved="false"></xref>（水法）则基于一套完全不同的计算逻辑与原理运作（如辅星翻卦水法，向上起星）。</p>
  example: []
  syntax:
    content: public enum FlipGuaMethod
