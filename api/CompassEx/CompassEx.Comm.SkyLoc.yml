  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 基于指定的天干序列索引与地支序列索引初始化 <xref href="CompassEx.Comm.SkyLoc" data-throw-if-not-resolved="false"></xref> 类的新实例。
  remarks: >-
    <b>★ 边界安全重构说明：</b>

    已修正历史版本中对边界检查使用大于号（<code>&gt;</code>）导致的拦截穿透漏洞（例如：当 <code class="paramref">SkyIndex</code> 传入 <code>10</code> 时原逻辑无法拦截，会在下一步初始化时引发系统崩溃）。现已全面收紧为严谨的元素范围闭区间防御。
  example: []
  syntax:
    content: public SkyLoc(int SkyIndex, int LocIndex)
    parameters:
    - id: SkyIndex
      type: System.Int32
      description: 天干在十天干序列中的绝对索引位置，有效取值范围为 <code>0 ~ 9</code>。可参考：<xref href="CompassEx.Comm.SkyClass.SkyNames" data-throw-if-not-resolved="false"></xref>。
    - id: LocIndex
      type: System.Int32
      description: 地支在十二地支序列中的绝对索引位置，有效取值范围为 <code>0 ~ 11</code>。可参考：<xref href="CompassEx.Comm.LocClass.LocNames" data-throw-if-not-resolved="false"></xref>。
    content.vb: Public Sub New(SkyIndex As Integer, LocIndex As Integer)
  overload: CompassEx.Comm.SkyLoc.#ctor*
  exceptions:
  - type: System.IndexOutOfRangeException
    commentId: T:System.IndexOutOfRangeException
    description: 当传入的天干索引或地支索引超出其各自对应的合法物理数组边界时抛出此异常。
  nameWithType.vb: SkyLoc.New(Integer, Integer)
  fullName.vb: CompassEx.Comm.SkyLoc.New(Integer, Integer)
  name.vb: New(Integer, Integer)
