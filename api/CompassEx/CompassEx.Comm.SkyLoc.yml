    id: .ctor
    path: CompassEx/Comm/SkyLoc.cs
    startLine: 95
  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 基于指定的双字干支组合名称（如“甲子”）初始化 <xref href="CompassEx.Comm.SkyLoc" data-throw-if-not-resolved="false"></xref> 类的新实例。
  remarks: >-
    <p><b>解构原理：</b></p>

    <p>方法内部会自动提取 <code class="paramref">SkyLocName</code> 的第 1 个字符（索引 0）作为天干字面量，提取第 2 个字符（索引 1）作为地支字面量。</p>

    <p>随后，通过分别检索它们在 <xref href="CompassEx.Comm.SkyClass.SkyNames" data-throw-if-not-resolved="false"></xref> 和 <xref href="CompassEx.Comm.LocClass.LocNames" data-throw-if-not-resolved="false"></xref> 中的位置，隐式链式传递给核心的双索引构造函数完成装配。</p>
  example: []
  syntax:
    content: public SkyLoc(string SkyLocName)
    parameters:
    - id: SkyLocName
      type: System.String
      description: 由天干和地支按顺序组成的双字字符串（例如：“甲子”）。
    content.vb: Public Sub New(SkyLocName As String)
  overload: CompassEx.Comm.SkyLoc.#ctor*
  exceptions:
  - type: System.IndexOutOfRangeException
    commentId: T:System.IndexOutOfRangeException
    description: 当输入的字符串长度不足、或拆分出的单字无法在全局干支元数据中找到对应索引时抛出此异常。
  nameWithType.vb: SkyLoc.New(String)
  fullName.vb: CompassEx.Comm.SkyLoc.New(String)
  name.vb: New(String)
