    startLine: 139
  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 根据给定的年份干支（五虎遁月法），推算该月的天干地支。
  remarks: >-
    五虎遁口诀：“甲己之年丙作首，乙庚之岁戊为头，丙辛必定寻庚上，丁壬壬位顺行流，戊癸何方发，甲寅上好求。”

    该方法根据年干或月干的对应关系，结合地支位置计算出正确的月干，并组合成完整的干支。
  example: []
  syntax:
    content: public static SkyLoc FiveTiger(SkyClass YearS, LocClass MonthL)
    parameters:
    - id: YearS
      type: CompassEx.Comm.SkyClass
      description: 年份的天干对象（<xref href="CompassEx.Comm.SkyClass" data-throw-if-not-resolved="false"></xref>），用于获取当前年份的天干名称。
    - id: MonthL
      type: CompassEx.Comm.LocClass
      description: 月份的地支对象（<xref href="CompassEx.Comm.LocClass" data-throw-if-not-resolved="false"></xref>），用于获取当前月份的地支名称。
    return:
      type: CompassEx.Comm.SkyLoc
      description: 返回推算后的月份完整天干地支对应的 <xref href="CompassEx.Comm.SkyLoc" data-throw-if-not-resolved="false"></xref> 对象。
    content.vb: Public Shared Function FiveTiger(YearS As SkyClass, MonthL As LocClass) As SkyLoc
  overload: CompassEx.Comm.SkyLoc.FiveTiger*
