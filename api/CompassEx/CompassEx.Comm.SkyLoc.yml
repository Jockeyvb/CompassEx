  summary: 根据日的天干地支与指定的小时数（五鼠遁时法），推算该时辰的天干地支。
  remarks: >-
    五鼠遁口诀：“甲己还加甲，乙庚丙作初，丙辛从戊起，丁壬庚子居，戊癸何方发，壬子是真途。”

    此重载方法直接接收 <xref href="CompassEx.Comm.SkyLoc" data-throw-if-not-resolved="false"></xref> 对象。
