      description: 包含日的天干地支信息的 <xref href="CompassEx.Comm.SkyLoc" data-throw-if-not-resolved="false"></xref> 对象。
    - id: Hour
      type: System.Int32
      description: 当前的小时数（0-23之间的整数），用于判断对应的时辰（如：1点为丑时）。
    return:
      type: CompassEx.Comm.SkyLoc
      description: 返回推算后的时辰完整天干地支对应的 <xref href="CompassEx.Comm.SkyLoc" data-throw-if-not-resolved="false"></xref> 对象。
