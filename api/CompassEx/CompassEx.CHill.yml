  namespace: CompassEx
  summary: 返回当前 <xref href="CompassEx.CHill" data-throw-if-not-resolved="false"></xref> 实例的哈希代码。
  remarks: >-
    算法遵循乘法哈希机制（非对称质数相乘），将参与相等性判定的 <xref href="CompassEx.CHill.Name" data-throw-if-not-resolved="false"></xref> 和 <xref href="CompassEx.CHill.hillType" data-throw-if-not-resolved="false"></xref> 字段进行组合计算，

    以确保在散列表（如 <xref href="System.Collections.Generic.Dictionary%602" data-throw-if-not-resolved="false"></xref>）中具备优秀的分布均匀性。
  example: []
  syntax:
    content: public override int GetHashCode()
