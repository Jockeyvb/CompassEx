  assemblies:
  - CompassEx
  namespace: CompassEx
  summary: 获取二十四山方位对应的角度范围。
  remarks: >-
    <p>二十四山是风水学与中国传统历法中用于标示方位的重要概念，将圆周 360 度等分为 24 个扇区，每个扇区占 15 度。</p>

    <p>本方法通过传入山名和类型，返回对应的 <xref href="CompassEx.Comm.CompassRangEX" data-throw-if-not-resolved="false"></xref> 角度范围对象。</p>
  example:
  - >-
    <pre><code class="lang-csharp">// 示例：获取传统中国二十四山中“子”山的角度范围

    CompassRangEX range = CompassEx.Get24HillDegree("子");

    Console.WriteLine($"子山范围：{range.StartDegree}° 至 {range.EndDegree}°");</code></pre>
  syntax:
    content: public static CompassRangEX Get24HillDegree(string HillName, HillType ht = HillType.CHill)
    parameters:
    - id: HillName
      type: System.String
      description: 二十四山的名称（例如："子"、"午"、"卯"、"酉"、"乾"、"巽"、"艮"、"坤" 等）。
    - id: ht
      type: CompassEx.HillType
      description: 山向类型，默认为中国传统二十四山（<xref href="CompassEx.HillType.CHill" data-throw-if-not-resolved="false"></xref>）。
    return:
      type: CompassEx.Comm.CompassRangEX
      description: 返回包含起始角度、终止角度及中心角度的 <xref href="CompassEx.Comm.CompassRangEX" data-throw-if-not-resolved="false"></xref> 方位范围对象。
    content.vb: Public Shared Function Get24HillDegree(HillName As String, ht As HillType = HillType.CHill) As CompassRangEX
  overload: CompassEx.CHill.Get24HillDegree*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: 当 <code class="paramref">HillName</code> 为 null 或空字符串时抛出。
  nameWithType.vb: CHill.Get24HillDegree(String, HillType)
  fullName.vb: CompassEx.CHill.Get24HillDegree(String, CompassEx.HillType)
  name.vb: Get24HillDegree(String, HillType)
