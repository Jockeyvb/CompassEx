    id: GetCBeforGuas
    path: CompassEx/CHill.cs
    startLine: 234
  assemblies:
  - CompassEx
  namespace: CompassEx
  summary: 获取当前正针二十四山度数范围内所包含、跨越的所有天盘先天 64 卦对象集合。
  remarks: >-
    <p><b>⚠️ 边界算法解析：</b></p>

    <p>由于二十四山的分野（每山 15 度）与 64 卦的分野（每卦 5.625 度）在几何上并不整齐重合，存在交错跨越的现象。</p>

    <p>为了实现高精度的卦象检索，本方法在比对结束边界时，对结束度数执行了减去 <code>0.01</code> 度的微小容差修正（即 <code>kv.Key.End - 0.01</code>），从而能够完美、精确地将临界卦象对象拉入当前二十四山的归属区间内。</p>
  example: []
  syntax:
    content: public Dictionary<CompassRangEX, GuaClass> GetCBeforGuas()
    return:
      type: System.Collections.Generic.Dictionary{CompassEx.Comm.CompassRangEX,CompassEx.Gua.GuaClass}
      description: 返回一个以 <xref href="CompassEx.Comm.CompassRangEX" data-throw-if-not-resolved="false"></xref> 为键、<xref href="CompassEx.Gua.GuaClass" data-throw-if-not-resolved="false"></xref> 为值的字典集合，包含所有落入该山范围内的卦象。
    content.vb: Public Function GetCBeforGuas() As Dictionary(Of CompassRangEX, GuaClass)
  overload: CompassEx.CHill.GetCBeforGuas*
