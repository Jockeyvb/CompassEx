  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: >-
    获得十二个月的月紫白飞星信息（中宫信息），返回字典中 Key 为地支类（如寅为正月，卯为二月）。


    <p>注：十二月紫白本身不存在方位信息，为防止误解已将 <xref href="CompassEx.Comm.FlyStar.StarDirection" data-throw-if-not-resolved="false"></xref> 设置为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>。若需详细获得每月中的方位信息，请使用入参调用 <xref href="CompassEx.Comm.FlyStar.GetFlyStars(System.Int32%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> 获取月中飞布情况。</p>
  example: []
  syntax:
    content: public static Dictionary<LocClass, FlyStar> MonthFlyStars(LocClass YearLoc)
    parameters:
    - id: YearLoc
      type: CompassEx.Comm.LocClass
      description: 年支实例（<xref href="CompassEx.Comm.LocClass" data-throw-if-not-resolved="false"></xref>）。
    return:
      type: System.Collections.Generic.Dictionary{CompassEx.Comm.LocClass,CompassEx.Comm.FlyStar}
      description: 返回地支与月飞星中宫信息的字典。
    content.vb: Public Shared Function MonthFlyStars(YearLoc As LocClass) As Dictionary(Of LocClass, FlyStar)
  overload: CompassEx.Comm.FlyStar.MonthFlyStars*
