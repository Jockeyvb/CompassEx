  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: >-
    表示紫白飞星类，用于管理飞星的名称、索引、数值、九宫方位以及对应的后天八卦属性。


    <p>紫白飞星：年、月紫白，入中宫之星逆推，分布九宫位是顺飞。</p>

    <p>为了方便使用，年紫白飞星方法：<xref href="CompassEx.Comm.FlyStar.YearFlyStar(System.Int32)" data-throw-if-not-resolved="false"></xref> 的年值必须是立春后的年值。</p>

    <p>月紫白飞星方法：<xref href="CompassEx.Comm.FlyStar.MonthFlyStars(CompassEx.Comm.LocClass)" data-throw-if-not-resolved="false"></xref>（注：实际方法为 <xref href="CompassEx.Comm.FlyStar.MonthFlyStars(CompassEx.Comm.LocClass)" data-throw-if-not-resolved="false"></xref>）需要传入年支类获得布满十二月飞星值，但九宫方位为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>，因为九宫飞布不存在。若要获得所有十二月的九宫方位应该使用 <xref href="CompassEx.Comm.FlyStar.GetFlyStars(System.Int32%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> 方法重新获得，每月飞布宫位如：<code>GetFlyStars(MonthFlyStar.First().StarValue, true, true)</code> 获得正月飞布情况。</p>

    <p>日紫白飞星：是按节气冬至后第一个甲子为一白顺飞，乙丑为二黑坤，夏至后第一个甲子为一日逆飞，乙丑为九紫。</p>

    <p>时紫白飞星：是按天干阴阳顺逆飞，阳为顺飞，阴为逆飞。</p>

    <p><span style="font-weight:bold;color:red;">重点是：每一个紫白中宫为 StarValue（星值），年、月、日、时紫白应该有独立的飞布宫位，则可使用九宫方位应使用 <xref href="CompassEx.Comm.FlyStar.GetFlyStars(System.Int32%2cSystem.Boolean%2cSystem.Boolean)" data-throw-if-not-resolved="false"></xref> 方法重新获得。例如每月飞布宫位：<code>GetFlyStars(MonthFlyStar.First().StarValue, true, true)</code> 读取属性 <xref href="CompassEx.Comm.FlyStar.StarDirection" data-throw-if-not-resolved="false"></xref> 获得九宫方位信息。</span></p>
