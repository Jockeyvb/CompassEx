    id: Get24HillDegree
    path: CompassEx/CompassEx.cs
    startLine: 189
  assemblies:
  - CompassEx
  namespace: CompassEx
  summary: 根据指定的山名，计算并获取该山在二十四山罗盘中所占据的绝对度数范围。
  remarks: >-
    <p><b>推演原理：</b></p>

    <ul><li>二十四山以<b>壬山</b>为度数起点，初始绝对方位设为 <code>337.5</code> 度。</li><li>根据该山名在列表中的索引位置，按每山 <code>15</code> 度顺时针累加。</li><li>当计算出的起始或结束度数超过 <code>360</code> 度时，系统会自动执行闭环修正（扣除 360 度）以限制在 <code>0 ~ 360</code> 度正常范围内。</li></ul>
  example: []
  syntax:
    content: public static CompassRangEX Get24HillDegree(string HillName)
    parameters:
    - id: HillName
      type: System.String
      description: 指定的山名（如“壬”、“子”、“癸”等）。
    return:
      type: CompassEx.Comm.CompassRangEX
      description: 返回表示该山起始与结束角度的 <xref href="CompassEx.Comm.CompassRangEX" data-throw-if-not-resolved="false"></xref> 范围对象。
    content.vb: Public Shared Function Get24HillDegree(HillName As String) As CompassRangEX
  overload: CompassEx.CompassEx.Get24HillDegree*
  nameWithType.vb: CompassEx.Get24HillDegree(String)
  fullName.vb: CompassEx.CompassEx.Get24HillDegree(String)
  name.vb: Get24HillDegree(String)
