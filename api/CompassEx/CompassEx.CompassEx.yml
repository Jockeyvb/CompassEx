    id: GetAfterGuaSubDegree
    path: CompassEx/CompassEx.cs
    startLine: 301
  assemblies:
  - CompassEx
  namespace: CompassEx
  summary: 根据指定的后天八卦卦名，计算并获取其在罗盘上所占据的绝对度数范围。
  remarks: >-
    <p><b>推演原理：</b></p>

    <ul><li>后天八卦以<b>坎卦</b>为度数起点，初始绝对方位设为 <code>337.5</code> 度。</li><li>根据卦名在后天序列中的索引位置，按每卦 <code>45</code> 度顺时针累加。</li><li>计算结果若超过 <code>360</code> 度，系统会自动执行闭环修正以保持在 <code>0 ~ 360</code> 度范围内。</li></ul>
  example: []
  syntax:
    content: public static CompassRangEX GetAfterGuaSubDegree(string Name)
    parameters:
    - id: Name
      type: System.String
      description: 后天八卦的卦名（如“坎”、“坤”等）。
    return:
      type: CompassEx.Comm.CompassRangEX
      description: 返回表示该卦起始与结束角度的 <xref href="CompassEx.Comm.CompassRangEX" data-throw-if-not-resolved="false"></xref> 范围对象。
    content.vb: Public Shared Function GetAfterGuaSubDegree(Name As String) As CompassRangEX
