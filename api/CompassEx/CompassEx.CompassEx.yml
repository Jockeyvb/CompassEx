  summary: 获取或设置当前罗盘指向的度数。
  remarks: >-
    <p><b>警告（副作用）：</b>当设置（<code>set</code>）此属性的值时，系统会自动调用内部的 <code>Init()</code> 方法。</p>

    <p>该方法会根据新传入的度数，重新计算并刷新与之关联的二十四山、后天八卦以及先天 64 卦等所有依赖属性。</p>
  example: []
  syntax:
    content: public double Degree { get; set; }
    parameters: []
    return:
      type: System.Double
      description: 一个 <xref href="System.Double" data-throw-if-not-resolved="false"></xref> 值，表示罗盘的当前角度（通常为 0 至 360 度）。
    content.vb: Public Property Degree As Double
  overload: CompassEx.CompassEx.Degree*
