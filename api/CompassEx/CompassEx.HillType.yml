  namespace: CompassEx
  summary: 天盘缝针二十四山。
  remarks: 方位较地盘正针顺时针（向右）偏转 7.5 度。主要用于观看与测量水口、河流、道路等动态流水的来去方位（纳水），主掌财禄与富贵。
  example: []
  syntax:
    content: SHill = 2
    return:
      type: CompassEx.HillType
