  summary: 人盘中针二十四山。
  remarks: 方位较地盘正针逆时针（向左）偏转 7.5 度。主要用于测量周围静态山峰、高大建筑物（砂）的方位与五行生克（消砂），主掌人丁、健康与贵人。
  example: []
  syntax:
    content: RHill = 4
    return:
      type: CompassEx.HillType
