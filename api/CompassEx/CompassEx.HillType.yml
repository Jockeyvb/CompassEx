  namespace: CompassEx
  summary: 地盘正针二十四山。
  remarks: 以正南北（磁针指向）为方位基准。主要用于测量山脉来龙走向（格龙）以及决定建筑物的坐向（立向），主掌内堂气场与乘气。
  example: []
  syntax:
    content: CHill = 1
    return:
      type: CompassEx.HillType
