  assemblies:
  - CompassEx
  namespace: CompassEx
  summary: 表示风水罗盘上的二十四山盘层类型。
  remarks: >-
    <p>

    本枚举采用位标记（Bitwise Flags）设计，支持使用按位或（OR）运算符进行多盘层的组合与判定。

    </p>

    <p>

    三盘（地盘、天盘、人盘）在罗盘上呈同心圆错位排列，各自对齐不同的磁针方位，并应用于不同的风水堪舆范畴（如立向、消砂、纳水）。

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">// 检查是否包含地盘或天盘

    HillType activePlates = HillType.CHill | HillType.SHill;

    if ((activePlates &amp; HillType.CHill) != 0) { /* 执行地盘逻辑 */ }</code></pre>
  syntax:
    content: >-
      [Flags]

      public enum HillType : byte
    content.vb: >-
      <Flags>

      Public Enum HillType As Byte
