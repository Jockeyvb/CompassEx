    path: CompassEx/Gua/GuaQi.cs
    startLine: 78
  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 先天洛数：动态计算并获取当前单卦所落先天的空间卦位在罗盘上对应的后天洛书卦气数。
  remarks: >-
    <b>★ LINQ 架构重构解析：</b>

    已将历史版本中的繁琐循环检索（<code>foreach</code>）重构为声明式的 LINQ 一行流。算法利用 LINQ 遍历八卦元数据流，动态抽取各个单卦的后天绝对范围，一旦判定本卦的先天空间范围起点（<code>Start</code>）完美落入该后天区间内，即立刻中断检索并安全产出其后天量化值。
  example: []
  syntax:
    content: public int GuaQiNumber { get; }
    parameters: []
    return:
      type: System.Int32
      description: 一个 <xref href="System.Int32" data-throw-if-not-resolved="false"></xref> 整数，代表一至九运的玄空大卦洛书数（通常为后天卦序数加一）。
    content.vb: Public ReadOnly Property GuaQiNumber As Integer
  overload: CompassEx.Gua.GuaQi.GuaQiNumber*
  exceptions:
  - type: System.Exception
    commentId: T:System.Exception
    description: 当罗盘空间度数计算错位，或未能匹配到任何合法的八卦全覆盖范围时抛出此异常。
