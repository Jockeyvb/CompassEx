  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 表示玄空大卦体系中“卦气”（洛书数及先天五行生成数）的推演与判别实体类。
  remarks: >-
    <p><b>术数原理：</b></p>

    <p>本类实现了风水学玄空大卦的核心法则。六爻大卦的卦气通常是以其<b>上卦（外卦）</b>的三爻单卦为准进行推演。</p>

    <p>通过将当前卦的先天卦位（几何空间角度范围）与罗盘后天八卦的方位进行重合对齐，从而提取出该卦位上所承载的后天洛书运数（<code>GuaQiNumber</code>），并最终映射出基于河图洛书的先天五行属性（生成数五行）。</p>
  example: []
  syntax:
    content: public class GuaQi
    content.vb: Public Class GuaQi
