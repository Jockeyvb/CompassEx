    id: ToSolarTime
    path: CompassEx/Comm/TymeTimeExtensions.cs
    startLine: 286
  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 【扩展方法】将 .NET 原生的 <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref> 快速转化为 Tyme 历法库专用的 <xref href="tyme.solar.SolarTime" data-throw-if-not-resolved="false"></xref> 高精度阳历时间对象。
  remarks: >-
    本方法作为系统高频使用的核心桥接管道，常用于将电脑当前系统时间（如 <xref href="System.DateTime.Now" data-throw-if-not-resolved="false"></xref>）或从数据库读取的勘测时间，

    无缝转换为历法库模型，以便后续进行高精度的立春换年柱、节气换月柱等核心易学理气数理推演。
  example: []
  syntax:
