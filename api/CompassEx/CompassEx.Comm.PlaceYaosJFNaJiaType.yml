  summary: 获取或设置所临爻的位置索引。
  example: []
  syntax:
    content: public int PlaceYao { readonly get; set; }
    parameters: []
    return:
      type: System.Int32
      description: >-
        爻位索引范围为 <code>0</code> 到 <code>5</code>。


        <ul><li><code>0</code>：初爻（最下方）</li><li><code>1</code>：二爻</li><li><code>2</code>：三爻</li><li><code>3</code>：四爻</li><li><code>4</code>：五爻</li><li><code>5</code>：上爻（最上方）</li></ul>
