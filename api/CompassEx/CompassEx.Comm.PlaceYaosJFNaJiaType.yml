  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 获取或设置该爻位下隐藏的伏神六亲属性数组。
  remarks: 易学中，当本卦（用卦）缺某六亲时，需去首卦（本宫八纯卦）对应的爻位寻找。此时本卦的爻称为“飞神”，找出来的本宫卦六亲即为“伏神”，伏于飞神之下。
  example: []
  syntax:
    content: public SixRelativeClass HideRelative { readonly get; set; }
    parameters: []
    return:
      type: CompassEx.Gua.SixRelativeClass
      description: >-
        一个 <xref href="CompassEx.Gua.SixRelativeClass" data-throw-if-not-resolved="false"></xref> 枚举数组，代表本爻（飞神）下方所伏藏的六亲。


        <ul><li>若当前爻位无伏神，该属性可为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> 或空数组。</li><li>在常规京房易学中通常至多 1 个伏神，但在特定排卦或三元盘复合算法中允许存在多个伏神（多伏情况）。</li></ul>
    content.vb: Public Property HideRelative As SixRelativeClass
  overload: CompassEx.Comm.PlaceYaosJFNaJiaType.HideRelative*
  seealso:
