  assemblies:
  - CompassEx
  namespace: CompassEx.Comm
  summary: 表示三元64卦中所临卦的卦爻纳甲信息（采用京房纳甲体系）。
  remarks: >-
    <p>本结构体用于记录六爻预测或易学计算中，具体某一个爻位的核心属性。</p>

    <p>包含了爻位索引、对应的六亲关系、天干地支（纳甲）信息，以及该爻位下可能隐藏的<b>伏神六亲</b>信息。</p>
