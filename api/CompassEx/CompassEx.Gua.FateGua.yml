    parameters:
    - id: d
      type: System.DateTime
      description: 公历出生时间(最好带时分秒），用于校正立春真实命年（确定精确的生肖与三元命年分界线）
    - id: Sex
      type: System.String
      description: 性别，仅支持【男/女】，男女命卦计算对应的数学公式与飞星轨迹不同
    - id: ToGua
      type: CompassEx.Gua.GuaClass
      description: 罗盘六爻向卦实例，不可为空（用于比对房屋坐向与个人命卦的吉凶关系）
