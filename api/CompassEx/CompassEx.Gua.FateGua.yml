      repo: https://github.com/Jockeyvb/CompassEx.git
    id: .ctor
    path: CompassEx/Gua/FateGua.cs
    startLine: 132
  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: >-
    初始化命卦推演实例，自动完成本命卦、出入卦、纳甲吉凶、得福干支年份全量计算(<font color="red"><b>非收山出煞之用，理气罗盘上的收山出煞，请看：<xref href="CompassEx.Gua.TianJiGua" data-throw-if-not-resolved="false"></xref>天机出卦法</b></font>)<br />

    <font color="color">三元命卦之天机出卦法推算原理：例用：向卦：晋卦，卦宫为【乾】，出卦及卦气是：【坎】7、【震】8、【兑】4<br />

    1、人命出卦：如1951年男命为【4绿巽】命，后天洛数为4。<br />
        用命卦的后天洛数4与出晋卦之卦宫的出卦中的先天洛数对比则：【坎】7、【震】8、【兑】4<br />
        则结果4绿巽为出卦<br />
    2、以向卦的京房纳甲<xref href="CompassEx.Gua.NaJiaJFResult" data-throw-if-not-resolved="false"></xref>加杨公纳甲<xref href="CompassEx.Gua.NaJiaYGResult" data-throw-if-not-resolved="false"></xref>，判断是否命庚（干支）出卦和得福，例：1981年男命（辛酉） 命卦：【1白坎】命，向卦亦用【晋】卦，出卦参考上三卦<br />
      （1）命庚出卦：乾宫之出卦：【坎】纳戊、【震】纳庚、【兑】纳丁 ，如果戊、庚、丁年出生的人亦为出卦。例中：辛酉年则为入卦，可得福。<br />
      （2）得福人命庚：除了出卦的命庚则应为得福，如：甲、乙、丙、己、辛、壬、癸年出生。<br />
      （3）得福最大的命庚：看晋卦在【乾】宫中七世飞爻卦（1乾、2姤、3遁、4否、5观、6剥、7晋[游魂卦]、8大有[归魂卦]）第几卦，以爻动推算：乾卦为本宫则纳甲、壬年生人命庚得福，姤为初爻变出下卦为巽纳辛，以此类推<br />
       (4)得福之年：看卦宫【乾】七世飞爻变出的第几爻，如按姤卦，则按初爻变是甲子年，遁卦按二爻变是甲寅年如此类推。若是乾本宫则按天干论，则甲、壬年得福，晋为第7卦游魂卦,特别处理的按变第4爻得福处理，则壬午年得福，则以观卦得福年一致。<br />
    人命出卦与纳甲出卦同是出卦论。</font>
  example: []
