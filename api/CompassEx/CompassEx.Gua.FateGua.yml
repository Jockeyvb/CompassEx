    id: GetFateGua
    path: CompassEx/Gua/FateGua.cs
    startLine: 215
  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 根据公历生日、性别，计算校正立春后的【三元后天三爻本命卦】
  remarks: >-
    本算法严格遵循传统三元九运紫白飞星命卦口诀进行数学建模：


    <ol><li><b>岁首分界：</b> 严格以立春精确交节时间为准。立春前出生者自动视作上一年出生，年份减1。</li><li><b>年数求一（九进制约简）：</b> 将公历年份四位数字逐位累加，直到缩减为 1~9 的个位基数（等价于 Mod 9 算法）。</li><li><b>男命公式：</b> 运星逆行，使用 <code>11 - 基数</code>。若余数为5寄宫于【坤二宫】，为0归【坎一宫】。</li><li><b>女命公式：</b> 运星顺行，使用 <code>基数 + 4</code>（即加9取余）。若余数为5寄宫于【艮八宫】，为0归【离九宫】。</li><li><b>后天映射：</b> 最终数字 1~9 严格映射后天八卦卦宫位置返回。</li></ol>
  example: []
  syntax:
    content: public static GuaSubClass GetFateGua(DateTime d, string Sex)
    parameters:
    - id: d
      type: System.DateTime
      description: 公历出生时间，自动识别立春前后校正命年
    - id: Sex
      type: System.String
      description: 性别【男/女】，区分不同命卦公式
    return:
      type: CompassEx.Gua.GuaSubClass
      description: 校正并计算完成后的三元后天三爻命卦实例 <xref href="CompassEx.Gua.GuaSubClass" data-throw-if-not-resolved="false"></xref>
    content.vb: Public Shared Function GetFateGua(d As Date, Sex As String) As GuaSubClass
