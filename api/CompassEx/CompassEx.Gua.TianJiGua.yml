  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 表示天机出卦法的推演与判定实体类。
  remarks: >-
    <p><b>书籍记载：</b>本算法依据余胜唐、刘贲等老师的著作记载进行工程化实现，一般用于风水学中的“收山出煞”(非三元命卦)业务场景。

    <br />在立向时可使用<xref href="CompassEx.Gua.TianJiGua.GetOutGuas" data-throw-if-not-resolved="false"></xref> 方法获得所有出卦的六爻卦

    <br />若要使用“三元命卦判断”请查看<xref href="CompassEx.Gua.FateGua" data-throw-if-not-resolved="false"></xref>及<xref href="CompassEx.Gua.FateGua.%23ctor(System.DateTime%2cSystem.String%2cCompassEx.Gua.GuaClass)" data-throw-if-not-resolved="false"></xref>。</p>

    <p><b>算法原理：</b>根据六爻卦之卦宫（六纯卦）进行八卦爻变，通过京房易卦法的七世飞爻得出五卦（六爻卦），其上下拆分出的三爻卦集合（共 5 个）定义为“入卦”；其余未出现的 3 个三爻卦则定义为“出煞（出卦）”。

    </p>

    <b><font color="red">立向时必须注意不能立在卦中的伏神所在的爻<xref href="CompassEx.Gua.TianJiGua.YaoTypes" data-throw-if-not-resolved="false"></xref>属性，注意检视：<xref href="CompassEx.Comm.PlaceYaosJFNaJiaType" data-throw-if-not-resolved="false"></xref>类型和<xref href="CompassEx.Comm.PlaceYaosJFNaJiaType.HideRelative" data-throw-if-not-resolved="false"></xref>伏神所在之爻应该避开</font></b>
