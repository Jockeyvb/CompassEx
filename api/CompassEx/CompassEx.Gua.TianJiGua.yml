  remarks: >-
    本构造函数专门用于风水理气中的“收山出煞”判定。

    通过推导当前向卦所属卦宫的飞爻状态，划分出哪些后天三爻卦属于理气相合的“入卦（吉）”，哪些属于犯煞的“出卦（凶）”。

    <b>注意：</b> 本构造函数不用于判断个人本命卦是否出卦。若需推演个人命卦与住宅的出入卦吉凶，请参阅 <xref href="CompassEx.Gua.FateGua" data-throw-if-not-resolved="false"></xref>。
