    id: IsOutGua
    path: CompassEx/Gua/TianJiGua.cs
    startLine: 295
  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: >-
    判断指定卦象是否属于“天机出卦”（用于玄空大卦物理峦头的收山出煞）

    三元命卦的出卦判断不一样,要了解天机出卦法之人命卦出卦请看<xref href="CompassEx.Gua.FateGua.IsOutGua" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    <p>

    <b>玄空大卦天机出卦法理论概述：</b><br />

    在玄空大卦（六十四卦）理气中，三元地理以“一运、二运、三运、四运”为江东卦（地元），

    “六运、七运、八运、九运”为江西卦（天元），“五运”天心顺逆分行。<br />

    所谓<b>出卦</b>，是指龙、山、向、水的气场没有处于同一个父母卦（或同运、通气）的管辖范围内，

    导致阴阳差错、气场杂乱。在峦头修造中，若犯“天机出卦”，则无法达到“收山出煞”的效果，主凶。

    </p>

    <p>

    <b>本方法校验逻辑：</b><br />

    1. 提取对比卦（<code class="paramref">CompareGua</code>）的上卦（<code>UpGua</code>）在后天八卦或大卦系统中的量化数值（<code>AfterQuantity</code>）。<br />

    2. 在预设的出卦字典表（<code>OutGuaSubs</code>）中进行检索。<br />

    3. 若存在匹配记录，说明该卦象已跨越父母卦界限，判定为“出卦”（返回 <code>true</code>）；反之则为“不出卦”（返回 <code>false</code>）。

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">GuaClass currentGua = GetCurrentGua();

    if (analyzer.IsOutGua(currentGua))

    {
        // 犯天机出卦，需调整向线或进行收山出煞消砂化解
        Console.WriteLine("警告：此局犯天机出卦！");
    }</code></pre>
  syntax:
    content: public bool IsOutGua(GuaClass CompareGua)
    parameters:
    - id: CompareGua
      type: CompassEx.Gua.GuaClass
      description: 需要进行出卦鉴定与比对的源卦象对象（<xref href="CompassEx.Gua.GuaClass" data-throw-if-not-resolved="false"></xref>）。
    return:
      type: System.Boolean
      description: >-
        如果该卦象符合天机出卦规则，则返回 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">true</a>（即属于出卦，峦头断为不吉）；

        如果属于大卦内气、合局通气，则返回 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/builtin-types/bool">false</a>。
    content.vb: Public Function IsOutGua(CompareGua As GuaClass) As Boolean
  overload: CompassEx.Gua.TianJiGua.IsOutGua*
