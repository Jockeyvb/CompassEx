      type: CompassEx.Comm.PlaceYaosJFNaJiaType[]
      description: >-
        存储该卦所临爻位的京房纳甲与六亲信息。该属性返回值遵循以下规则：


        <ul><li>支持返回 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>，表示当前处于“无临爻”状态。</li><li>数组长度限制为 <code>0</code> 到 <code>2</code>，即最多只会存储 2 个临爻的序号及数据(只能相邻两个爻）。</li><li>数组元素中完整包含了对应爻位的六亲属性与纳甲干支。</li></ul>
