  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 加载三元罗盘上的 64 卦中的向卦类实例。
  remarks: >-
    <p><b>🔄 易学数据加载与投影流程：</b></p>

    <ol><li>

    <b>状态激活：</b>依次调用 <code>LoadHideRelative()</code> 与 <code>LoadSixRelative()</code> 方法，确保向卦实例的伏神和六亲底层数据被完整加载至内存。

    </li><li>

    <b>数理组装：</b>通过 LINQ 表达式遍历临爻索引集合，按爻位从向卦中精准提取对应的纳甲干支（<code>SkyLocs</code>）、六亲（<code>SixRelative</code>）以及伏神数据。

    </li><li>

    <b>结果交付：</b>最终将提取的数据转换为全新的 <xref href="CompassEx.Comm.PlaceYaosJFNaJiaType" data-throw-if-not-resolved="false"></xref> 结构体数组，并赋值给当前实例的 <xref href="CompassEx.Gua.TianJiGua.PlaceYaoTypes" data-throw-if-not-resolved="false"></xref> 属性。

    </li></ol>
  example: []
  syntax:
    content: public TianJiGua(CGuaClass ToGua)
    parameters:
    - id: ToGua
      type: CompassEx.CGuaClass
      description: >-
        传入的向卦对象实例（<xref href="CompassEx.CGuaClass" data-throw-if-not-resolved="false"></xref>）。


        <p>内部将基于该对象的临爻位置集合（<code>PlaceYaos</code>）进行动态数据提取与纳甲绑定。</p>
