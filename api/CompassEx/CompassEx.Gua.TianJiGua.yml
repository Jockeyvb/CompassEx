    <p><b>⚠️ 核心使用条件：</b></p>

    <p>本属性默认可能无值。在使用前，必须先调用 <xref href="CompassEx.Gua.TianJiGua.%23ctor(CompassEx.CGuaClass)" data-throw-if-not-resolved="false"></xref> 方法对当前实例进行构建，随后该属性才会被赋予相应的计算值。</p>

    <p>该属性基于三元盘卦体系构建，关联对象请参见 <xref href="CompassEx.CGuaClass" data-throw-if-not-resolved="false"></xref>。</p>
