  fullName: CompassEx.Gua.TianJiGua.GetOutGuas()
  type: Method
  source:
    remote:
      path: CompassEx/Gua/TianJiGua.cs
      branch: master
      repo: https://github.com/Jockeyvb/CompassEx.git
    id: GetOutGuas
    path: CompassEx/Gua/TianJiGua.cs
    startLine: 336
  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: >-
    获得天盘六十四卦中所有属于“出卦”的卦象字典集合。

    三元命卦的出卦判断不一样,要了解天机出卦法之人命卦出卦请看<xref href="CompassEx.Gua.FateGua.IsOutGua" data-throw-if-not-resolved="false"></xref>
  remarks: >-
    <p>

    <b>天盘六十四卦与出卦应用：</b><br />

    在玄空大卦理气中，天盘主要用于<b>收纳外气、消砂纳水</b>（部分流派亦用于推算天时公转之气）。

    本方法通过遍历当前天盘中所有的初始卦象配置（<code>CompassEx.CBeforeGuas</code>），

    逐一调用 <xref href="CompassEx.Gua.TianJiGua.IsOutGua(CompassEx.Gua.GuaClass)" data-throw-if-not-resolved="false"></xref> 方法进行天机出卦法的法理鉴定。

    </p>

    <p>

    <b>业务逻辑与过滤机制：</b><br />

    1. <b>高阶筛选 (Where)：</b> 利用 LINQ 表达式对天盘的方位卦象映射进行断言筛选，仅保留判定结果为“出卦”的条目。<br />

    2. <b>结构重组 (ToDictionary)：</b> 将筛选出的 <xref href="System.Collections.Generic.KeyValuePair%602" data-throw-if-not-resolved="false"></xref> 集合重新构建为强类型的字典。

    此字典常用于后续的峦头风水吉凶断验，或在绘制罗盘时对出卦方位进行特殊的红线警告或煞位标注。

    </p>
  example:
  - >-
    <pre><code class="lang-csharp">// 示例：获取所有天盘出卦方位，并打印出对应的方位名称与卦名

    Dictionary&lt;CompassRangEX, GuaClass&gt; outGuas = compassAnalyzer.GetOutGuas();

    foreach (var kvp in outGuas)

    {
        Console.WriteLine($"方位 [{kvp.Key.Name}] 对应的卦象 [{kvp.Value.GuaName}] 犯天机出卦，收山出煞时应当避开。");
    }</code></pre>
  syntax:
    content: public Dictionary<CompassRangEX, GuaClass> GetOutGuas()
    return:
      type: System.Collections.Generic.Dictionary{CompassEx.Comm.CompassRangEX,CompassEx.Gua.GuaClass}
      description: >-
        返回一个 <xref href="System.Collections.Generic.Dictionary%602" data-throw-if-not-resolved="false"></xref> 字典集合。<br />

        键（Key）为罗盘方位区间对象（<xref href="CompassEx.Comm.CompassRangEX" data-throw-if-not-resolved="false"></xref>），

        值（Value）为该方位上对应且犯了“天机出卦”的六十四卦卦象对象（<xref href="CompassEx.Gua.GuaClass" data-throw-if-not-resolved="false"></xref>）。
    content.vb: Public Function GetOutGuas() As Dictionary(Of CompassRangEX, GuaClass)
