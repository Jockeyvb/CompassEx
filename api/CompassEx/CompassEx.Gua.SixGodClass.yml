  namespace: CompassEx.Gua
  summary: 表示六爻预测学中“六神”（六兽）的动态装配与排盘实体类。
  remarks: >-
    本类完整实现了传统六爻预测中由日天干发动起六神的排盘法则。

    通过将十天干映射到对应的六神初始起点，自下而上（初爻至上爻）依次排布青龙、朱雀、勾陈、腾蛇、白虎、玄武，常用于六爻装骨髓及神煞吉凶推演。
