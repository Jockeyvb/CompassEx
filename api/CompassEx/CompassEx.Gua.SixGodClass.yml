    id: GetSixGod
    path: CompassEx/Gua/SixGodClass.cs
    startLine: 93
  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 基于日天干的绝对顺位索引，通过极致性能的静态数组查找算法，排布自初爻至上爻的六神完备序列。
  remarks: >-
    <p><b>★ 算法升级与架构重构解析：</b></p>

    <p>1. <b>消灭数学分支：</b>废弃了历史版本中依靠整数除法（<code>iDaySkyIndex / 2</code>）与条件修正（<code>iPos++</code>）的模糊推导，改用确定性的静态预存查找数组 <code>_skyToSixGodStartLookup</code>，在 <code>O(1)</code> 复杂度内瞬间锁定本局六神起首位置。</p>

    <p>2. <b>修复数据血缘：</b>修正了原本在循环装配时错误将每个爻位独立递增值赋予 <xref href="CompassEx.Gua.SixGodClass.StartIndex" data-throw-if-not-resolved="false"></xref> 的逻辑偏误。当前版本中，全数组 6 个爻位对象的 <xref href="CompassEx.Gua.SixGodClass.StartIndex" data-throw-if-not-resolved="false"></xref> 均死死锚定在原始起首点上，而各爻位的实际六神名称（<xref href="CompassEx.Gua.SixGodClass.Name" data-throw-if-not-resolved="false"></xref>）则自下而上进行完备的环形顺流步进（若超过索引 5 则自动闭环归零）。</p>
  example: []
  syntax:
    content: public static SixGodClass[] GetSixGod(int iDaySkyIndex)
    parameters:
    - id: iDaySkyIndex
      type: System.Int32
      description: 日天干在十天干序列中的绝对索引位置，有效取值范围为 <code>0 ~ 9</code>。
    return:
      type: CompassEx.Gua.SixGodClass[]
      description: 返回一个长度严格为 6 的 <xref href="CompassEx.Gua.SixGodClass" data-throw-if-not-resolved="false"></xref> 原生数组，按初爻到上爻的顺序排列。
    content.vb: Public Shared Function GetSixGod(iDaySkyIndex As Integer) As SixGodClass()
  overload: CompassEx.Gua.SixGodClass.GetSixGod*
  exceptions:
  - type: System.IndexOutOfRangeException
    commentId: T:System.IndexOutOfRangeException
    description: 当传入的日天干索引超出 <code>0 ~ 9</code> 的合法天干边界时，内部查找矩阵会抛出越界异常。
  nameWithType.vb: SixGodClass.GetSixGod(Integer)
  fullName.vb: CompassEx.Gua.SixGodClass.GetSixGod(Integer)
  name.vb: GetSixGod(Integer)
