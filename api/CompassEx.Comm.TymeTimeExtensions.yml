  namespace: CompassEx.Comm
  summary: 将 Tyme 历法库的公历时间对象转换为 .NET 标准的 <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref> 实例。
  remarks: <b>转换细节：</b>该方法通过显式提取输入对象的具体时分秒数值进行直接映射，生成的 <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref> 实例默认其 <xref href="System.DateTime.Kind" data-throw-if-not-resolved="false"></xref> 属性为 <xref href="System.DateTimeKind.Unspecified" data-throw-if-not-resolved="false"></xref>。
  example: []
  syntax:
    content: public static DateTime ToDateTime(this SolarTime st)
    parameters:
    - id: st
      type: tyme.solar.SolarTime
      description: 被扩展的当前 <xref href="tyme.solar.SolarTime" data-throw-if-not-resolved="false"></xref> 公历时间对象实例。
    return:
      type: System.DateTime
      description: 返回一个包含完整年、月、日、时、分、秒信息的 <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref> 结构体对象。
    content.vb: Public Shared Function ToDateTime(st As SolarTime) As Date
  overload: CompassEx.Comm.TymeTimeExtensions.ToDateTime*
