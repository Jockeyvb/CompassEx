  summary: 针对元贞历法核心库（Tyme）时间与日期对象的 C# 官方标准 <xref href="System.DateTime" data-throw-if-not-resolved="false"></xref> 转换扩展工具类。
  remarks: 本静态类通过提供高效的链式扩展方法（Extension Methods），实现了将三方历法库中的公历时间（<xref href="tyme.solar.SolarTime" data-throw-if-not-resolved="false"></xref>）与公历日期（<xref href="tyme.solar.SolarDay" data-throw-if-not-resolved="false"></xref>）快速转换为 .NET 原生的时间结构体，常用于前后端排盘结果的数据对接与串联。
