  namespace: CompassEx.Gua
  summary: 黄石公翻卦掌与辅星翻卦水法核心数字化推导类。
  remarks: >-
    本类作为 <code>CompassEx.Gua</code> 命名空间下的运算引擎，负责执行底层八卦变爻翻转计算。

    内部核心轨迹已通过 O(1) 效率的数字化索引进行无缝链式建模，全面兼容 C# 主程序调用与第三方 JavaScript 插件扩展。
