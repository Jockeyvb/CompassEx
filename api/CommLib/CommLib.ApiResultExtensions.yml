    id: ToResult
    path: CommLib/ApiDynamicResult.cs
    startLine: 111
  assemblies:
  - CommLib
  namespace: CommLib
  summary: 将万能的动态 <xref href="Newtonsoft.Json.Linq.JToken" data-throw-if-not-resolved="false"></xref> 瞬间强转映射为指定的任意强类型泛型包装对象。
  remarks: >-
    1. 若传入的动态源为空（<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>），则直接安全断言并返回空。<br />

    2. 方法会自动校验业务状态标识 <xref href="CommLib.ApiDynamicResult.Succeeded" data-throw-if-not-resolved="false"></xref>；若接口判定失败、或者核心数据节点无有效内容，则直接截断后续的反射开销，安全赋予泛型默认值（<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/default">default</a>）。<br />

    3. 反序列化底层采用 Newtonsoft 的元数据逆向对账机制（<xref href="Newtonsoft.Json.Linq.JToken.ToObject%60%601" data-throw-if-not-resolved="false"></xref>），支持自动抹平因大小写差异或非对等结构导致的微小错配。
  example: []
  syntax:
    content: public static ApiResult<T> ToResult<T>(this ApiDynamicResult dynamicResult)
    parameters:
    - id: dynamicResult
      type: CommLib.ApiDynamicResult
      description: 当前正在执行链式调用的原始动态 API 结果实例。
    typeParameters:
    - id: T
      description: 期望转换并填充的目标强类型（例如实体列表或布尔值）。
    return:
      type: CommLib.ApiResult{{T}}
      description: 返回装配完毕、带有强类型业务数据的全新 <xref href="CommLib.ApiResult%601" data-throw-if-not-resolved="false"></xref> 外壳实例。
    content.vb: Public Shared Function ToResult(Of T)(dynamicResult As ApiDynamicResult) As ApiResult(Of T)
