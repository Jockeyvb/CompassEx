  namespace: CommLib
  summary: 鲁班尺细分小格计算实体类
  remarks: >-
    核心功能：用于解析鲁班尺最小细分刻度，每4个小格组成一个鲁班大格，

    提供小格名称、吉凶释义、刻度区间、所属父级大格，支持按刻度/名称初始化、按组获取同组4小格数据

    鲁班尺单小格固定尺寸：13.40625MM
