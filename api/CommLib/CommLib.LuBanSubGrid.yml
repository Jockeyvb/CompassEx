    id: .ctor
    path: CommLib/Assist/LuBanGrid.cs
    startLine: 409
  assemblies:
  - CommLib
  namespace: CommLib
  summary: 根据具体的物理刻度值初始化鲁班细分小格对象。
  remarks: >-
    1. 刻度值会自动向下取整（<xref href="System.Math.Floor(System.Double)" data-throw-if-not-resolved="false"></xref>），确保系统计算精度统一。<br />

    2. 根据取整后的刻度与每格固定尺寸（<xref href="CommLib.LuBanSubGrid.SubGridFixed" data-throw-if-not-resolved="false"></xref>）计算出所属的小格累计步数。<br />

    3. 自动匹配并加载对应的循环小格中文名称、吉凶断语释义、理论刻度区间及循环索引。<br />

    4. 传入负数刻度属非法输入，将直接拦截并提前终止后续的所有初始化配置。
  example: []
  syntax:
    content: public LuBanSubGrid(double Value)
    parameters:
    - id: Value
      type: System.Double
      description: 输入的鲁班尺刻度值（单位：毫米，MM）。
    content.vb: Public Sub New(Value As Double)
