  assemblies:
  - CommLib
  namespace: CommLib
  summary: 获取当前刻度所属大格内的 4 个一组完整细分小格集合。
  remarks: >-
    鲁班尺算法规则：每 4 个细分小格（分格）构成一个完整的大格单元。<br />

    该方法通过传入的任意刻度进行锚定位移，逆向推算并自动补齐当前组内的全部 4 个连续小格。
  example: []
  syntax:
    content: public static List<LuBanSubGrid> GetGroup(double value, LuBanGrid parent = null)
    parameters:
    - id: value
      type: System.Double
      description: 目标鲁班尺长度刻度值（单位：毫米，MM）。
    - id: parent
      type: CommLib.LuBanGrid
      description: 归属的父级鲁班大格对象，若不传则默认为空（<a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a>）。
    return:
      type: System.Collections.Generic.List{CommLib.LuBanSubGrid}
      description: 返回当前大格对应的连续 4 个鲁班细分小格列表。
    content.vb: Public Shared Function GetGroup(value As Double, parent As LuBanGrid = Nothing) As List(Of LuBanSubGrid)
  overload: CommLib.LuBanSubGrid.GetGroup*
  nameWithType.vb: LuBanSubGrid.GetGroup(Double, LuBanGrid)
  fullName.vb: CommLib.LuBanSubGrid.GetGroup(Double, CommLib.LuBanGrid)
