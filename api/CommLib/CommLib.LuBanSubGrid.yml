  summary: 根据小格中文名称初始化鲁班细分小格对象。
  remarks: >-
    1. 方法会检索传入名称在 <xref href="CommLib.LuBanSubGrid.LuBanSubGridNames" data-throw-if-not-resolved="false"></xref> 数组中的位置索引。<br />

    2. 若传入无效或不存在的名称（找不到对应索引），则触发健壮性拦截，提前终止后续的所有初始化配置。
