  assemblies:
  - CommLib
  namespace: CommLib
  summary: 丁兰尺大格计算实体类
  remarks: >-
    核心功能：根据输入刻度值/格位循环次数，解析丁兰尺十大基础大格，

    自动匹配格位名称、吉凶释义、吉凶颜色、起止刻度、归属细分小格，

    支持获取当前凶格左右最近吉祥刻度值，10个大格为一组循环往复

    丁兰尺单标准大格固定尺寸：38.78MM
