  summary: 丁兰尺细分小格计算实体类
  remarks: >-
    核心功能：解析丁兰尺最小细分刻度，每4个小格组成一个标准丁兰大格，

    提供小格名称、刻度区间、父级绑定、按组获取同组4小格能力

    丁兰尺单细分小格固定尺寸：9.695MM
