  assemblies:
  - CommLib
  namespace: CommLib
  summary: 鲁班尺大格计算实体类
  remarks: >-
    核心功能：根据输入刻度值/格位索引，解析鲁班尺八大基础格位（财、病、离、义、官、劫、害、吉），

    自动匹配格位吉凶颜色、起止刻度、所属小格，同时提供左右相邻最近吉值查询能力

    鲁班尺单大格固定尺寸：53.625MM，8个大格为一组循环往复
