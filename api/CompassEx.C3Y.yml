    startLine: 59
  assemblies:
  - CompassEx
  namespace: CompassEx
  summary: 先天 64 卦对象字典缓存（天盘）。
  remarks: >-
    <p><b>性能说明：</b></p>

    <p>使用字典缓存所有 64 卦对象，避免每次计算时重复创建新对象，提高执行性能。系统启动时需要优先初始化此字典。</p>

    <p><b>排列规则：</b></p>

    <p>罗盘上先天排行从午为乾1、兑2、离3、震4（阳仪），巽5、坎6、艮7、坤8（阴仪）。</p>

    <p><b>度数映射：</b></p>

    <p>罗盘上子坤（360度）至午乾（180度）。从坤 0 度至天风姤 180 度，乾左为顺 180 度至地雷复 360 度。内卦为卦宫，外卦相荡而成。</p>
  example: []
  syntax:
    content: >-
      [JsonIgnore]

      public static Dictionary<CompassRangEX, GuaClass> CBeforeGuas
    return:
      type: System.Collections.Generic.Dictionary{CompassEx.Comm.CompassRangEX,CompassEx.Gua.GuaClass}
      description: 键为 <xref href="CompassEx.Comm.CompassRangEX" data-throw-if-not-resolved="false"></xref> 范围，值为对应的 <xref href="CompassEx.Gua.GuaClass" data-throw-if-not-resolved="false"></xref> 卦象对象。
    content.vb: >-
      <JsonIgnore>

      Public Shared CBeforeGuas As Dictionary(Of CompassRangEX, GuaClass)
  attributes:
  - type: Newtonsoft.Json.JsonIgnoreAttribute
    ctor: Newtonsoft.Json.JsonIgnoreAttribute.#ctor
    arguments: []
