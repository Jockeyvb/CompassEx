  namespace: CompassEx.Gua
  summary: 表示六爻或八字预测学中“六亲”（父母、子孙、官鬼、妻财、兄弟）的装配与推演实体类。
  remarks: >-
    六亲是由全卦宫（或日元）的五行属性与各个爻位（或干支）的五行属性通过“生克制化”的河洛数理规则比对推演而来。

    本类提供了通过字面名称快速创建六亲对象，以及通过标准五行生克规则（<xref href="CompassEx.Comm.FiveAttrRule" data-throw-if-not-resolved="false"></xref>）进行实体动态装配的静态工厂方法。
