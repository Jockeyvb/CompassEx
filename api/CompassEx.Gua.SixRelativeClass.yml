  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 根据标准的五行生克规则对象，动态推演并实例化对应的六亲类实体。
  remarks: >-
    <p><b>⚠️ 类型强转契约说明：</b></p>

    <p>本方法内部依赖于将自定义五行生克规则 <code class="paramref">far</code> 显式强制转换为整型（<code>(int)far</code>）来直接作为 <xref href="CompassEx.Gua.SixRelativeClass.SixRelatives" data-throw-if-not-resolved="false"></xref> 数组的内存检索下标。</p>

    <p>为了防止系统在运行时发生非预期崩溃，必须确保 <xref href="CompassEx.Comm.FiveAttrRule" data-throw-if-not-resolved="false"></xref> 内部枚举元素的排布顺位与本类的六亲元数据序列（妻财、子孙、兄弟、官鬼、父母）在易学数理上保持<b>绝对严格的严格对齐</b>。</p>
  example: []
  syntax:
    content: public static SixRelativeClass GetSixRelative(FiveAttrRule far)
    parameters:
    - id: far
      type: CompassEx.Comm.FiveAttrRule
      description: 包含当前爻位与主宫生克关系的 <xref href="CompassEx.Comm.FiveAttrRule" data-throw-if-not-resolved="false"></xref> 规则对象或枚举。
    return:
      type: CompassEx.Gua.SixRelativeClass
      description: 返回经过生克数理映射后装配完毕的 <xref href="CompassEx.Gua.SixRelativeClass" data-throw-if-not-resolved="false"></xref> 六亲实体对象。
    content.vb: Public Shared Function GetSixRelative(far As FiveAttrRule) As SixRelativeClass
  overload: CompassEx.Gua.SixRelativeClass.GetSixRelative*
  exceptions:
  - type: System.IndexOutOfRangeException
    commentId: T:System.IndexOutOfRangeException
    description: 当传入的生克规则对象转换后的整型数值超出 <code>0 ~ 4</code> 的六亲数组物理边界时抛出此异常。
