    startLine: 125
  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 判定指定的后天八卦单卦在当前天机卦局中是否属于“出卦”。
  remarks: >-
    <p>在玄空大卦风水体系中，主要通过此处的出卦逻辑进行<b>收山出煞</b>的度数判别（通常作用于罗盘 64 卦的分野上）。</p>

    <p><b>⚠️ 业务边界提示：</b>若您当前是要进行“三元命卦”的出卦判定，则需要严格按照纳甲法规则来进行推演。请不要使用本方法，改为调用 <code>FateGua.IsOutGua()</code> 方法。</p>
  example: []
  syntax:
    content: public bool IsOutGua(GuaSubClass CompareGua)
    parameters:
    - id: CompareGua
      type: CompassEx.Gua.GuaSubClass
      description: 需要比对、判定的后天八卦单卦对象。
    return:
      type: System.Boolean
      description: 若该单卦存在于出卦集合（<xref href="CompassEx.Gua.TianJiGua.OutGuaSubs" data-throw-if-not-resolved="false"></xref>）中，则返回 <code>true</code>（代表已出卦）；否则返回 <code>false</code>。
    content.vb: Public Function IsOutGua(CompareGua As GuaSubClass) As Boolean
  overload: CompassEx.Gua.TianJiGua.IsOutGua*
