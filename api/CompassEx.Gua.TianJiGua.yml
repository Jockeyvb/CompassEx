  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 表示天机出卦法的推演与判定实体类。
  remarks: >-
    <p><b>文献记载：</b>本算法依据余胜唐、刘贲等老师的著作记载进行工程化实现，一般用于风水学中的“收山出煞”以及“三元命卦判断”等业务场景。</p>

    <p><b>算法原理：</b>根据六爻卦之卦宫（六纯卦）进行八卦爻变，通过京房易卦法的七世飞爻得出五卦（六爻卦），其上下拆分出的三爻卦集合（共 5 个）定义为“入卦”；其余未出现的 3 个三爻卦则定义为“出煞（出卦）”。</p>
  example: []
  syntax:
    content: public class TianJiGua
    content.vb: Public Class TianJiGua
