  namespace: CompassEx.Gua
  summary: 初始化 <xref href="CompassEx.Gua.TianJiGua" data-throw-if-not-resolved="false"></xref> 类的新实例，自动根据传入的向卦计算出对应的天机入卦与出卦集合。
  remarks: >-
    <p><b>初始化逻辑：</b></p>

    <ol><li>通过向卦（<code class="paramref">ToGua</code>）自动寻找其所属的六纯卦卦宫（<code>GuaSelf</code>）。</li><li>基于卦宫展开京房易卦飞爻算法，提取上下卦（三爻卦）去重后填充至 <xref href="CompassEx.Gua.TianJiGua.InGuaSubs" data-throw-if-not-resolved="false"></xref> 入卦集合。</li><li>将未在入卦集合中出现的其余后天单卦提取出来，填充至 <xref href="CompassEx.Gua.TianJiGua.OutGuaSubs" data-throw-if-not-resolved="false"></xref> 出卦集合，用以进行出煞判定。</li></ol>
  example: []
  syntax:
    content: public TianJiGua(GuaClass ToGua)
    parameters:
    - id: ToGua
      type: CompassEx.Gua.GuaClass
      description: 输入的罗盘向卦对象（六爻卦结构）。
