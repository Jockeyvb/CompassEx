  namespace: CommLib
  summary: 鲁班尺大格（分格）类。
  remarks: >-
    该类用于计算和表达传统堪舆学中“鲁班尺”的 8 个大格（如财、病、离、义等）。

    鲁班尺主要用于阳宅建筑、门户、家具等尺寸的吉凶量度。

    每个大格内部包含 4 个小格，大格的物理固定循环尺寸常数定义为 53.625 毫米。
  example: []
  syntax:
    content: public class LuBanGrid
    content.vb: Public Class LuBanGrid
