  namespace: CommLib
  summary: 丁兰尺小格（分格）类。
  remarks: >-
    该类用于计算和表达传统堪舆学中“丁兰尺”的 40 个小格（如福星、及第等）。

    每 4 个小格组合为一个大格（由 <xref href="CommLib.DingLanGrid" data-throw-if-not-resolved="false"></xref> 表达）。

    丁兰尺每小格的物理固定尺寸约为 9.695 毫米。
