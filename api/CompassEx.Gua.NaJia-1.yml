  summary: 泛型纳甲推演核心发动机（处理类）。
  remarks: >-
    本类采用控制反转与静态工厂设计模式，将繁复的京房、杨公装卦推演逻辑封装于内部。

    对外提供高内聚的统一出口方法 <xref href="CompassEx.Gua.NaJia%601.Execute" data-throw-if-not-resolved="false"></xref>，完美支持动态扩充与高效计算。
