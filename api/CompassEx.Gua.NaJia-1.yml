  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 静态只读的杨公纳甲数理映射字典。
  remarks: >-
    严格遵循地理风水“净阴净阳”及“二十四山纳甲”数理基础规则：


    <ul><li><b>乾坤艮巽（四维卦）：</b> 纳纯干，地支序列初始为空（高级理气应用中可根据需要扩充其同名方位山字）。</li><li><b>震兑离坎（四正卦）：</b> 依纳干所属五行的三合局归化地支（震木局[ "亥", "卯", "未"]、兑金局["巳", "酉", "丑"]、离火局["寅", "午", "戌"]、坎水局["申", "子", "辰"]）。</li></ul>
  example: []
  syntax:
    content: public static readonly Dictionary<string, NaJia<TResult>.NaJiaYGItem> YGNaJiaDC
    return:
      type: System.Collections.Generic.Dictionary{System.String,CompassEx.Gua.NaJia`1.NaJiaYGItem}
    content.vb: Public Shared ReadOnly YGNaJiaDC As Dictionary(Of String, NaJia(Of TResult).NaJiaYGItem)
