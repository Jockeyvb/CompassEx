  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 根据正针（地盘）二十四山向，计算并获取对应的杨公纳甲特异性结果。
  remarks: >-
    <p><b>【业务背景】</b> 本方法实现了杨公堪舆理气中的“纳甲”核心逻辑。通过检索输入的二十四山向名称，自动匹配并归纳出其所属的八卦本宫或干支纳甲归属（天干纳甲、地支纳甲）。</p>

    <p><b>【架构安全机制】</b> 本方法虽声明在泛型类中，但属于杨公派系的<b>特异性静态方法</b>。内部引入了运行时类型锁，强制限定只有当类泛型参数 <code class="typeparamref">TResult</code> 确为 <xref href="CompassEx.Gua.NaJiaYGResult" data-throw-if-not-resolved="false"></xref> 时方可成功执行，从而在多派系并存的堪舆系统中确保数理逻辑的安全隔离。</p>
  example: []
  syntax:
    content: public static NaJiaYGResult CreateYG(CHill c)
    parameters:
    - id: c
      type: CompassEx.CHill
      description: 输入的正针二十四山向实例对象 (<xref href="CompassEx.CHill" data-throw-if-not-resolved="false"></xref>)。
    return:
      type: CompassEx.Gua.NaJiaYGResult
      description: 返回构建完成的杨公纳甲专属结果实例 (<xref href="CompassEx.Gua.NaJiaYGResult" data-throw-if-not-resolved="false"></xref>)。
    content.vb: Public Shared Function CreateYG(c As CHill) As NaJiaYGResult
  overload: CompassEx.Gua.NaJia`1.CreateYG*
  exceptions:
  - type: System.NotSupportedException
    commentId: T:System.NotSupportedException
    description: 当调用本方法的泛型类上下文（<code class="typeparamref">TResult</code>）不是指定的 <xref href="CompassEx.Gua.NaJiaYGResult" data-throw-if-not-resolved="false"></xref> 时阻断抛出。
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: 当传入的正针二十四山向参数 <code class="paramref">c</code> 为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> 时抛出。
