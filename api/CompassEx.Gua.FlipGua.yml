  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 根据输入的正针（地盘）二十四山向与指定的翻卦方法，推导并获取完整的九星翻卦映射字典。
  remarks: >-
    本方法是杨公风水堪舆中九星翻卦（如贪狼、巨门、禄存等）的核心入口。

    它首先依据杨公纳甲法则锁定传入山向的初始纳甲八卦作为翻卦起点，随后依据指定的翻卦掌诀（如黄泉翻卦、地母翻卦等）推演出全部的九星变卦序列。
  example: []
  syntax:
    content: public static Dictionary<NaJiaYGResult, NineStar> GetFlipGuaNineStarDC(CHill c, FlipGuaMethod m)
    parameters:
    - id: c
      type: CompassEx.CHill
      description: 输入的正针二十四山向实例对象 (<xref href="CompassEx.CHill" data-throw-if-not-resolved="false"></xref>)。
    - id: m
      type: CompassEx.Gua.FlipGuaMethod
      description: 执行翻卦时采用的具体掌诀法则(山法与水法)(<xref href="CompassEx.Gua.FlipGuaMethod" data-throw-if-not-resolved="false"></xref>)。
    return:
      type: System.Collections.Generic.Dictionary{CompassEx.Gua.NaJiaYGResult,CompassEx.Gua.NineStar}
      description: 返回一个以变卦子类 (<xref href="CompassEx.Gua.NaJiaYGResult" data-throw-if-not-resolved="false"></xref>) 为键、对应风水九星 (<xref href="CompassEx.Gua.NineStar" data-throw-if-not-resolved="false"></xref>) 为值的映射字典。
    content.vb: Public Shared Function GetFlipGuaNineStarDC(c As CHill, m As FlipGuaMethod) As Dictionary(Of NaJiaYGResult, NineStar)
  overload: CompassEx.Gua.FlipGua.GetFlipGuaNineStarDC*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: 当传入的山向对象 <code class="paramref">c</code> 为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> 时抛出。
