  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 根据指定的勘测分类（龙、山、水），获得翻卦后全盘八卦与游年九星的完整对应关系字典。
  remarks: >-
    <p><b>吉凶配星数理逻辑对照表：</b></p>

    <table><thead><tr><th class="term">勘测分类 (Method)</th><th class="description">游年星曜演变顺序 (Star Progression Path)</th></tr></thead><tbody><tr><td class="term">龙法 (Dragon) / 山法 (Hill)</td><td class="description">1辅(伏位) → 2贪(生气) → 3巨(天医) → 4禄(祸害) → 5文(六煞) → 6廉(五鬼) → 7武(延年) → 8破(绝命)</td></tr><tr><td class="term">水法 (Water)</td><td class="description">1辅(伏位) → 2武(延年) → 3破(绝命) → 4廉(五鬼) → 5贪(生气) → 6巨(天医) → 7禄(祸害) → 8文(六煞) （辅星水法特殊换算倒序轨迹）</td></tr></tbody></table>
  example: []
  syntax:
    content: public static Dictionary<NaJiaYGResult, NineStar> GetFlipGuaNineStarDC(GuaSubClass gs, FlipGuaMethod m)
    parameters:
    - id: gs
      type: CompassEx.Gua.GuaSubClass
      description: 要执行翻卦的基础主卦实例 (<xref href="CompassEx.Gua.GuaSubClass" data-throw-if-not-resolved="false"></xref>)。
    - id: m
      type: CompassEx.Gua.FlipGuaMethod
      description: 当前的翻卦九星勘测方法分类(山法与水法) (<xref href="CompassEx.Gua.FlipGuaMethod" data-throw-if-not-resolved="false"></xref>)。
    return:
      type: System.Collections.Generic.Dictionary{CompassEx.Gua.NaJiaYGResult,CompassEx.Gua.NineStar}
      description: 返回以 <xref href="CompassEx.Gua.NaJiaYGResult" data-throw-if-not-resolved="false"></xref> 卦象为键，<xref href="CompassEx.Gua.NineStar" data-throw-if-not-resolved="false"></xref> 游年星曜为值的配星映射字典。
    content.vb: Public Shared Function GetFlipGuaNineStarDC(gs As GuaSubClass, m As FlipGuaMethod) As Dictionary(Of NaJiaYGResult, NineStar)
  overload: CompassEx.Gua.FlipGua.GetFlipGuaNineStarDC*
