    startLine: 197
  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 根据输入的初始主卦，推导并生成其完整的 8 步纳甲翻卦后天八卦序列。
  remarks: >-
    本方法是翻卦核心算法。根据易学翻卦掌诀（九星翻卦、黄泉翻卦等业务基底），

    通过内部维护的翻卦索引字典 <code>FlipGuasDC</code> 定位主卦的本宫变换路径，

    并依次映射实例化出对应的八个易卦。
  example: []
  syntax:
    content: public static List<GuaSubClass> GetFlipGuaGuas(GuaSubClass gs)
    parameters:
    - id: gs
      type: CompassEx.Gua.GuaSubClass
      description: 要执行翻卦的基础主卦实例 (<xref href="CompassEx.Gua.GuaSubClass" data-throw-if-not-resolved="false"></xref>)。
    return:
      type: System.Collections.Generic.List{CompassEx.Gua.GuaSubClass}
      description: 返回一个包含 8 个严格按翻卦掌诀顺序排列的 <xref href="CompassEx.Gua.GuaSubClass" data-throw-if-not-resolved="false"></xref> 独立对象列表。
    content.vb: Public Shared Function GetFlipGuaGuas(gs As GuaSubClass) As List(Of GuaSubClass)
  overload: CompassEx.Gua.FlipGua.GetFlipGuaGuas*
  exceptions:
  - type: System.ArgumentNullException
    commentId: T:System.ArgumentNullException
    description: 当传入的主卦对象 <code class="paramref">gs</code> 为 <a href="https://learn.microsoft.com/dotnet/csharp/language-reference/keywords/null">null</a> 时抛出。
  - type: System.Collections.Generic.KeyNotFoundException
    commentId: T:System.Collections.Generic.KeyNotFoundException
    description: 当传入的卦名（如 乾、兑、离 等）不在标准的后天八卦映射字典中时抛出。
