    path: CompassEx/Gua/FlipGua.cs
    startLine: 142
  assemblies:
  - CompassEx
  namespace: CompassEx.Gua
  summary: 获得在不同 24 山太极点的五鬼运财方位结构。
  remarks: >-
    该方法属于堪舆学（风水）算法，通过传入的龙山（CHill），

    运用翻卦掌诀（龙上翻卦）计算出九星翻卦对冲关系，

    进而推导出辅星、五鬼（廉贞）临门以及天医来水的具体 24 山方位。
  example: []
  syntax:
    content: public static FiveGhostWealth GetFiveGhostWealth(CHill DragonHill)
    parameters:
    - id: DragonHill
      type: CompassEx.CHill
      description: 输入的龙山对象，代表当前计算的 24 山太极点坐标。
    return:
      type: CompassEx.Gua.FiveGhostWealth
      description: 返回一个包装了龙山方位、五鬼临门方位及天医来水方位的 <xref href="CompassEx.Gua.FiveGhostWealth" data-throw-if-not-resolved="false"></xref> 结构对象。
    content.vb: Public Shared Function GetFiveGhostWealth(DragonHill As CHill) As FiveGhostWealth
  overload: CompassEx.Gua.FlipGua.GetFiveGhostWealth*
  exceptions:
  - type: System.Exception
    commentId: T:System.Exception
    description: 当翻卦算法内部逻辑出错，未能正确匹配到“辅”、“廉”或“医”星数据时抛出异常。
